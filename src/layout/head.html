<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- <head> común a todas las páginas: build.py rellena idioma, título, descripción y rutas -->
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="alternate" hreflang="es" href="{{abs:es}}">
  <link rel="alternate" hreflang="gl" href="{{abs:gl}}">
  <link rel="alternate" hreflang="x-default" href="{{abs:es}}">
  <meta name="theme-color" content="#ffd23f">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23ffd23f'/%3E%3Cpath d='M8 34h48' stroke='%23241f5c' stroke-width='8' stroke-linecap='round'/%3E%3Cpath d='M30 34l-8 18M34 34l8 18' stroke='%23241f5c' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">

  <!-- Fuentes: Baloo 2 (títulos) + Nunito (texto) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- ?v= cambia con cada versión del CSS: el navegador nunca mezcla HTML nuevo con estilos viejos -->
  <link rel="stylesheet" href="{{root}}assets/css/styles.css?v={{v:css}}">
  <!-- Marca que hay JS antes de pintar, para que las apariciones al hacer scroll no parpadeen -->
  <script>document.documentElement.classList.add("js");</script>
</head>
